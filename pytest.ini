[pytest]
# ── 仓库根 pytest 配置（存在理由：实测，非风格偏好）────────────────────────
# 目的：把 rootdir 钉死在**仓库根**，使根 conftest.py 的兄弟包源码装配生效。
#
# 实测 2026-10-08：组合跑
#   pytest packages/chiyu-kernel/tests tools/tests packages/chiyu-decision/src/chiyu_decision/tests
# 时 rootdir 落到 packages/chiyu-kernel（首个含 [tool.pytest.ini_options] 的 pyproject.toml），
# 于是 confcutdir == rootdir，**仓库根 conftest.py 落在其之上不被加载**，
# 而根 conftest.py 正是把 chiyu-kernel / chiyu-decision / chiyu-portal / chiyu-cli
# 四个兄弟包 src 统一上 sys.path 的唯一装置 ⇒ 5 个决策脊柱测试全部
# ModuleNotFoundError 收集失败。单跑 decision 时因命中其包 pyproject 的
# pythonpath 恰好能导入，故该缺陷长期被"单跑绿"掩盖。
#
# 各子包 pyproject.toml 的 pythonpath 保持原样（单跑该包时仍自洽）；
# 本文件只负责 rootdir 归属，不做路径注入（路径统一由 conftest.py 按需插入）。
#
# ⛔ 不在此处写 pythonpath：ini 相对 rootdir 解析，历史上曾因调用方传参方式不同
#    解析出嵌套不存在路径（见 packages/chiyu-kernel/tests/conftest.py 头注）。
python_files = test_*.py
markers =
    pg: 真库 E2E（本地便携 PG chiyu_test；无库自动跳过，见 test_pg_e2e.py 头注红线）
