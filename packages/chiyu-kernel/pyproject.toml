[project]
name = "chiyu-kernel"
version = "0.1.0"
description = "ChiYu AI Native Foundation - L0 契约与 L1 基础设施内核"
requires-python = ">=3.11,<3.14"
dependencies = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.17", "tokenizers>=0.15"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
